[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airest-phonova"
version = "0.1.0"
description = "Standalone AIREST Phonova speech analysis package"
readme = "README_DEV.md"
requires-python = ">=3.9,<3.13"
license = { text = "AIREST Non-Commercial Research License v1.0" }
authors = [
  { name = "AIREST Authors" }
]
dynamic = ["dependencies"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
"airest.speech" = ["config/*.json"]
"airest.speech.util" = ["data/*.tsv"]
